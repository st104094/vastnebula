<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VastNebula DJ Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050509;--panel:rgba(14,16,28,.76);--text:#f7f8ff;--muted:#aab2c8;--line:rgba(34,211,238,.24);--purple:#8b5cf6;--cyan:#22d3ee;--pink:#f43f9d;--green:#4ade80;--shadow:0 24px 80px rgba(34,211,238,.18)}
    body[data-theme=day]{--bg:#f7f8fc;--panel:rgba(255,255,255,.82);--text:#111420;--muted:#596174;--line:rgba(139,92,246,.22);--shadow:0 24px 70px rgba(139,92,246,.14)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 18% 20%,rgba(139,92,246,.34),transparent 28rem),radial-gradient(circle at 86% 18%,rgba(34,211,238,.18),transparent 24rem),radial-gradient(circle at 50% 85%,rgba(244,63,157,.18),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}a{color:inherit;text-decoration:none}button,select,input{font:inherit}.grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(34,211,238,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(244,63,157,.09) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,#000,transparent 82%);animation:grid 14s linear infinite}@keyframes grid{to{background-position:54px 108px}}
    .top{position:sticky;top:0;z-index:10;min-height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:rgba(5,5,9,.66);backdrop-filter:blur(18px)}body[data-theme=day] .top{background:rgba(246,247,251,.72)}.brand,.nav,.actions,.hero-actions,.stats,.toolbar,.player,.footer{display:flex;align-items:center}.brand{gap:12px;font:900 18px Orbitron}.mark{width:34px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--cyan),var(--purple),var(--pink),var(--cyan));box-shadow:0 0 28px rgba(34,211,238,.75);animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.2)}}.nav{gap:8px}.nav a,.drawer a{padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:800}.nav a:hover,.drawer a:hover{color:var(--text);background:rgba(139,92,246,.14)}.actions{gap:10px}.btn,.pill,.icon,.menu,.close{border:1px solid var(--line);border-radius:8px;color:var(--text);background:rgba(255,255,255,.06);cursor:pointer}.pill,.btn{min-height:40px;padding:0 14px;font-weight:900}.primary,.pill.active{border-color:transparent;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 0 26px rgba(139,92,246,.34)}.icon,.menu,.close{display:grid;width:42px;aspect-ratio:1;place-items:center}.live-dot:before{content:"";width:12px;aspect-ratio:1;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green)}.menu{display:none}.drawer,.mask{position:fixed;inset:0;z-index:30;visibility:hidden;opacity:0;transition:.28s}.mask{background:rgba(0,0,0,.58)}.drawer{left:auto;width:min(320px,86vw);padding:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);transform:translateX(100%)}.open .drawer,.open .mask{visibility:visible;opacity:1}.open .drawer{transform:translateX(0)}.close{align-self:flex-end;font-size:28px}
    .section{width:min(1180px,calc(100vw - 36px));margin:0 auto;padding:86px 0}.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(360px,1.05fr);gap:34px;min-height:calc(100vh - 76px);align-items:center}.eyebrow{display:inline-flex;margin-bottom:16px;color:var(--cyan);font:800 13px Orbitron;text-transform:uppercase}h1,h2,h3{margin:0;font-family:Orbitron;line-height:1.08}h1{font-size:clamp(42px,7vw,86px)}h2{max-width:780px;font-size:clamp(28px,4vw,48px)}p{color:var(--muted);line-height:1.72}.hero p{max-width:620px;font-size:18px}.hero-actions{gap:12px;flex-wrap:wrap;margin-top:28px}.hero-actions .btn{display:inline-flex;align-items:center;min-height:48px;padding:0 20px}.stats{gap:18px;flex-wrap:wrap;margin-top:32px}.stats span{min-width:126px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stats b,.stats small{display:block}.stats b{color:var(--cyan);font:900 26px Orbitron}.stats small{color:var(--muted)}.hero-img{position:relative;min-height:520px;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}.hero-img:before{content:"";position:absolute;inset:-2px;background:linear-gradient(135deg,var(--purple),var(--cyan),var(--pink));filter:blur(28px);opacity:.55}.hero-img img{position:relative;width:100%;height:100%;min-height:520px;object-fit:cover;border:1px solid var(--line);box-shadow:var(--shadow)}.head{margin-bottom:28px}
    .banner{padding-top:0}.banner-box{min-height:220px;padding:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px}.banner-box strong{display:block;max-width:680px;font:900 clamp(24px,4vw,44px) Orbitron}.orb{width:min(280px,28vw);aspect-ratio:1.3;border-radius:8px;background:radial-gradient(circle at 30% 30%,var(--cyan),transparent 26%),radial-gradient(circle at 70% 58%,var(--pink),transparent 30%),linear-gradient(135deg,rgba(139,92,246,.55),rgba(34,211,238,.22));box-shadow:0 0 44px rgba(34,211,238,.28)}.music{display:grid;grid-template-columns:260px 1fr;gap:22px}.panel,.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.panel{align-self:start;display:grid;gap:18px;padding:18px}.panel label{display:grid;gap:8px;color:var(--muted);font-weight:900}input[type=range]{accent-color:var(--cyan)}select{min-height:40px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:rgba(12,14,24,.94)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.04);cursor:pointer}.chip.active{color:var(--text);background:rgba(34,211,238,.18)}.toolbar{justify-content:flex-end;gap:10px;margin-bottom:14px}.gridcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.gridcards.list{grid-template-columns:1fr}.cover{min-height:170px;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.85),transparent 28%),radial-gradient(circle at 70% 62%,rgba(244,63,157,.75),transparent 30%),linear-gradient(135deg,rgba(139,92,246,.68),rgba(0,0,0,.2))}.body{display:grid;gap:12px;padding:16px}.meta,.tags{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px}.tag{padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--cyan);background:rgba(34,211,238,.08);font-size:12px;font-weight:900}.wave{display:flex;align-items:end;gap:3px;height:80px;padding:24px}.wave span{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(to top,var(--purple),var(--cyan));animation:bars 1.2s ease-in-out infinite}@keyframes bars{50%{transform:scaleY(.55)}}.post img{width:100%;height:210px;object-fit:cover}.visual,.avatar{display:grid;place-items:center;min-height:170px;background:linear-gradient(135deg,rgba(34,211,238,.16),transparent),radial-gradient(circle,rgba(139,92,246,.58),transparent 56%);font:900 42px Orbitron}.avatar{font-size:48px}.footer{justify-content:space-between;gap:16px;width:min(1180px,calc(100vw - 36px));margin:0 auto 110px;padding:28px 0;border-top:1px solid var(--line);color:var(--muted)}.footer b{color:var(--text);font-family:Orbitron}.player{position:fixed;right:18px;bottom:18px;left:18px;z-index:24;gap:14px;min-height:74px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:rgba(5,5,9,.82);backdrop-filter:blur(18px);box-shadow:var(--shadow)}body[data-theme=day] .player{background:rgba(255,255,255,.82)}.player small{display:block;color:var(--muted)}.progress{flex:1;height:8px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.16)}.progress span{display:block;width:28%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--cyan))}.toast{position:fixed;right:18px;bottom:104px;z-index:40;max-width:min(360px,calc(100vw - 36px));padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);opacity:0;transform:translateY(10px);transition:.24s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:920px){.nav{display:none}.menu{display:grid}.hero,.music{grid-template-columns:1fr}.hero{padding-top:42px}.hero-img{min-height:360px;clip-path:polygon(0 0,100% 8%,100% 100%,0 92%)}.hero-img img{min-height:360px}.gridcards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.top{padding:0 16px}.brand span:last-child{display:none}.section{width:min(100vw - 24px,1180px);padding:62px 0}.gridcards{grid-template-columns:1fr}.banner-box{grid-template-columns:1fr}.orb{width:100%;max-height:110px}.player{align-items:stretch;flex-wrap:wrap}.progress{flex-basis:100%}}
  </style>
</head>
<body data-theme="night">
  <div class="grid"></div>
  <header class="top"><a class="brand" href="#home"><span class="mark"></span><span>VastNebula</span></a><nav class="nav"><a href="#music" data-i="navMusic"></a><a href="#radio" data-i="navRadio"></a><a href="#live" data-i="navLive"></a><a href="#shop" data-i="navShop"></a><a href="#engineers" data-i="navEngineers"></a><a href="#community" data-i="navCommunity"></a></nav><div class="actions"><button class="icon live-dot" aria-label="Live"></button><button class="pill" id="theme">Night</button><button class="pill" id="lang">EN</button><button class="menu" id="menu">☰</button></div></header>
  <aside class="drawer" id="drawer"><button class="close" id="close">×</button><a href="#music" data-i="navMusic"></a><a href="#radio" data-i="navRadio"></a><a href="#live" data-i="navLive"></a><a href="#shop" data-i="navShop"></a><a href="#engineers" data-i="navEngineers"></a><a href="#community" data-i="navCommunity"></a></aside><div class="mask" id="mask"></div>
  <main>
    <section class="hero section" id="home"><div><span class="eyebrow" data-i="heroEyebrow"></span><h1 data-i="heroTitle"></h1><p data-i="heroText"></p><div class="hero-actions"><a class="btn primary" href="#music" data-i="heroPrimary"></a><a class="btn" href="#live" data-i="heroSecondary"></a></div><div class="stats"><span><b>12K</b><small data-i="statListeners"></small></span><span><b>128</b><small data-i="statTracks"></small></span><span><b>42</b><small data-i="statCreators"></small></span></div></div><div class="hero-img"><img src="web-assets/hero-dj.svg" alt="Cyberpunk DJ performance"></div></section>
    <section class="banner section"><div class="banner-box"><div><span class="eyebrow">NEON WEEK</span><strong id="bannerText"></strong></div><div class="orb"></div></div></section>
    <section class="section" id="music"><div class="head"><span class="eyebrow" data-i="musicEyebrow"></span><h2 data-i="musicTitle"></h2></div><div class="music"><aside class="panel"><label><span data-i="bpmRange"></span><input id="bpm" type="range" min="90" max="150" value="132"><strong id="bpmVal"></strong></label><label><span>Key</span><select id="key"><option value="all">All</option><option>8A</option><option>9A</option><option>10B</option></select></label><div class="chips" id="chips"></div></aside><div><div class="toolbar"><button class="pill active" data-view="grid">Grid</button><button class="pill" data-view="list">List</button><select id="sort"><option value="hot" data-i="sortHot"></option><option value="bpm">BPM</option><option value="new" data-i="sortNew"></option></select></div><div class="gridcards" id="tracks"></div></div></div></section>
    <section class="section" id="radio"><div class="head"><span class="eyebrow" data-i="radioEyebrow"></span><h2 data-i="radioTitle"></h2></div><div class="gridcards" id="podcasts"></div></section>
    <section class="section" id="live"><div class="head"><span class="eyebrow" data-i="liveEyebrow"></span><h2 data-i="liveTitle"></h2></div><div class="gridcards" id="lives"></div></section>
    <section class="section" id="shop"><div class="head"><span class="eyebrow" data-i="shopEyebrow"></span><h2 data-i="shopTitle"></h2></div><div class="gridcards" id="shopGrid"></div></section>
    <section class="section" id="engineers"><div class="head"><span class="eyebrow" data-i="engineerEyebrow"></span><h2 data-i="engineerTitle"></h2></div><div class="gridcards" id="engineersGrid"></div></section>
    <section class="section" id="community"><div class="head"><span class="eyebrow" data-i="communityEyebrow"></span><h2 data-i="communityTitle"></h2></div><div class="gridcards" id="communityGrid"></div></section>
  </main>
  <footer class="footer"><b>VastNebula</b><span data-i="footerText"></span></footer>
  <div class="player"><div><small data-i="nowPlaying"></small><strong id="playerTitle">Neon Pulse</strong></div><button class="icon" id="play">▶</button><div class="progress"><span id="bar"></span></div><button class="icon" id="shuffle">⤨</button><button class="icon">Cart <b id="cart">0</b></button></div><div class="toast" id="toast"></div>
  <script>
    const T={zh:{navMusic:'音乐库',navRadio:'NJ电台',navLive:'直播',navShop:'商城',navEngineers:'调音师',navCommunity:'社区',heroEyebrow:'赛博朋克 DJ 音乐宇宙',heroTitle:'把现场、选歌、社区和商城接进同一个节拍。',heroText:'面向 DJ、NJ、调音师与电子音乐玩家的沉浸式平台：混音推荐、直播互动、作品预约、插件设备与创作者社区全部在线。',heroPrimary:'开始选歌',heroSecondary:'进入直播',statListeners:'在线听众',statTracks:'精选曲目',statCreators:'认证创作者',musicEyebrow:'专业选歌引擎',musicTitle:'按 BPM、Key 与能量快速锁定下一首。',bpmRange:'BPM 范围',sortHot:'热度',sortNew:'最新',radioEyebrow:'NJ电台',radioTitle:'节目、访谈、教程和新歌评论。',liveEyebrow:'实时现场',liveTitle:'直播间、弹幕与礼物面板。',shopEyebrow:'插件与硬件',shopTitle:'为演出和制作准备的装备。',engineerEyebrow:'调音师专区',engineerTitle:'预约混音、母带和现场系统调校。',communityEyebrow:'社区热帖',communityTitle:'从制作技巧到现场复盘，灵感不断线。',footerText:'为电子音乐创作者打造的体验原型。',nowPlaying:'正在播放'},en:{navMusic:'Music',navRadio:'NJ Radio',navLive:'Live',navShop:'Shop',navEngineers:'Engineers',navCommunity:'Community',heroEyebrow:'Cyberpunk DJ Universe',heroTitle:'Live rooms, crates, community, and gear in one beat.',heroText:'An immersive platform for DJs, NJs, engineers, and electronic music makers.',heroPrimary:'Start Digging',heroSecondary:'Enter Live',statListeners:'listeners',statTracks:'curated tracks',statCreators:'verified creators',musicEyebrow:'Selection Engine',musicTitle:'Lock the next track by BPM, key, and energy.',bpmRange:'BPM Range',sortHot:'Hot',sortNew:'Newest',radioEyebrow:'NJ Radio',radioTitle:'Shows, interviews, tutorials, and new music reviews.',liveEyebrow:'Realtime Stage',liveTitle:'Live rooms, bullet chat, and gift panels.',shopEyebrow:'Plugins & Hardware',shopTitle:'Gear for performance and production.',engineerEyebrow:'Engineer Hub',engineerTitle:'Book mixing, mastering, and live system tuning.',communityEyebrow:'Hot Threads',communityTitle:'From production tips to live recaps, ideas keep moving.',footerText:'A prototype for electronic music creators.',nowPlaying:'Now playing'}};
    const S={lang:'zh',theme:0,themes:['night','day','auto'],genre:'all',view:'grid',cart:0,playing:false,banner:0};
    const tracks=[['Neon Pulse','DJ Aster',128,'8A','Techno',9821,'2026-06-01'],['Chrome Afterglow','Luna Flux',132,'9A','House',8620,'2026-05-28'],['Signal Bloom','K-Volt',140,'10B','Trance',7314,'2026-06-03'],['Bass Circuit','Mira N',124,'8A','Bass',6891,'2026-05-18'],['Midnight Uplink','Orbit Nine',136,'9A','Techno',9122,'2026-05-30'],['Prism Runner','VJ Echo',118,'10B','House',6210,'2026-06-02']];
    const posts=[['如何让 128 BPM 的 Techno Drop 更有冲击力？','Production',248,36,'web-assets/community-production.svg'],['昨晚直播间的弹幕互动设计复盘','Live',193,28,'web-assets/community-live.svg'],['从老唱片到数字歌单：我的选歌工作流','Crate Digging',317,52,'web-assets/community-crates.svg']];
    const banners=['精选直播、插件折扣和创作者挑战同步开启。','用智能筛选把合拍推荐压缩到一次点击。','预约认证调音师，给你的作品最后一层亮度。'];
    const $=q=>document.querySelector(q);function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1600)}function tr(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[S.lang][e.dataset.i]);$('#lang').textContent=S.lang==='zh'?'EN':'中'}function theme(){let x=S.themes[S.theme];if(x==='auto'){const h=new Date().getHours();x=h>=7&&h<18?'day':'night'}document.body.dataset.theme=x;$('#theme').textContent=S.themes[S.theme].replace(/^\w/,c=>c.toUpperCase())}
    function wave(n){return Array.from({length:18},(_,i)=>`<span style="height:${18+((n*13+i*17)%38)}px;animation-delay:${i*.04}s"></span>`).join('')}function chips(){const gs=['all',...new Set(tracks.map(t=>t[4]))];$('#chips').innerHTML=gs.map(g=>`<button class="chip ${g===S.genre?'active':''}" data-genre="${g}">${g}</button>`).join('')}function renderTracks(){const bpm=+$('#bpm').value,key=$('#key').value,sort=$('#sort').value;$('#bpmVal').textContent='≤ '+bpm;let list=tracks.filter(t=>t[2]<=bpm&&(key==='all'||t[3]===key)&&(S.genre==='all'||t[4]===S.genre));list.sort((a,b)=>sort==='bpm'?b[2]-a[2]:sort==='new'?new Date(b[6])-new Date(a[6]):b[5]-a[5]);$('#tracks').classList.toggle('list',S.view==='list');$('#tracks').innerHTML=list.map((t,i)=>`<article class="card"><div class="cover"><div class="wave">${wave(i+2)}</div></div><div class="body"><h3>${t[0]}</h3><p>${t[1]}</p><div class="meta"><span class="tag">${t[2]} BPM</span><span class="tag">${t[3]}</span><span class="tag">${t[4]}</span><span>${t[5].toLocaleString()} plays</span></div><button class="btn primary play" data-title="${t[0]}">Play</button></div></article>`).join('')}
    function cards(){const pod=[['Night Shift','NJ Vega','music','42m','8.2K'],['Mix Clinic','NJ Echo','tutorial','58m','6.9K'],['Gear Talk','NJ Rio','review','36m','5.4K']];$('#podcasts').innerHTML=pod.map(p=>`<article class="card"><div class="cover"></div><div class="body"><h3>${p[0]}</h3><p>${p[1]} · ${p[3]} · ${p[4]}</p><span class="tag">${p[2]}</span></div></article>`).join('');$('#lives').innerHTML=['Aster Warehouse Set','Luna Flux Replay','Orbit Nine Premiere'].map((x,i)=>`<article class="card"><div class="cover"><div class="wave">${wave(i+5)}</div></div><div class="body"><span class="tag">${i?'回放':'直播中'}</span><h3>${x}</h3><p>Live chat and gift panel ready.</p><button class="btn primary gift">Gift</button></div></article>`).join('');$('#shopGrid').innerHTML=[['Nebula Limiter','VST/AU','$49','▣'],['Flux Controller','Hardware','$299','◈'],['Cyber Reverb','VST/AU','$39','◎']].map(p=>`<article class="card"><div class="visual">${p[3]}</div><div class="body"><h3>${p[0]}</h3><div class="meta"><span class="tag">${p[1]}</span><span>${p[2]}</span></div><button class="btn primary buy">Add to Cart</button></div></article>`).join('');$('#engineersGrid').innerHTML=[['Kai Chen','Mixing / Mastering','4.9','KC'],['Maya Lin','Vocal / Club Master','4.8','ML'],['Rex Wu','Live System','4.7','RW']].map(e=>`<article class="card"><div class="avatar">${e[3]}</div><div class="body"><h3>${e[0]} ✓</h3><p>${e[1]}</p><span class="tag">★ ${e[2]}</span><button class="btn primary book">Book</button></div></article>`).join('');$('#communityGrid').innerHTML=posts.map((p,i)=>`<article class="card post"><img src="${p[4]}" alt="${p[1]}"><div class="body"><span class="tag">${p[1]}</span><h3>${p[0]}</h3><div class="meta"><span>${p[3]} comments</span><span id="like${i}">${p[2]} likes</span></div><button class="btn like" data-like="${i}">Like</button></div></article>`).join('')}
    function bind(){menu.onclick=()=>document.body.classList.add('open');close.onclick=mask.onclick=()=>document.body.classList.remove('open');theme.onclick=()=>{S.theme=(S.theme+1)%S.themes.length;theme()};lang.onclick=()=>{S.lang=S.lang==='zh'?'en':'zh';tr()};bpm.oninput=key.onchange=sort.onchange=renderTracks;document.addEventListener('click',e=>{const g=e.target.closest('[data-genre]');if(g){S.genre=g.dataset.genre;chips();renderTracks()}const v=e.target.closest('[data-view]');if(v){S.view=v.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===v));renderTracks()}const p=e.target.closest('.play');if(p){playerTitle.textContent=p.dataset.title;S.playing=true;play.textContent='Ⅱ';toast('Playing '+p.dataset.title)}if(e.target.closest('.buy')){S.cart++;cart.textContent=S.cart;toast('Added to cart')}if(e.target.closest('.gift'))toast('Gift sent');if(e.target.closest('.book'))toast('Booking request created');const l=e.target.closest('[data-like]');if(l){const i=+l.dataset.like;posts[i][2]++;$('#like'+i).textContent=posts[i][2]+' likes';toast('Like saved')}});play.onclick=()=>{S.playing=!S.playing;play.textContent=S.playing?'Ⅱ':'▶'};shuffle.onclick=()=>toast('Shuffle mode toggled')}
    function init(){tr();theme();chips();renderTracks();cards();bind();setInterval(()=>{S.banner=(S.banner+1)%banners.length;bannerText.textContent=banners[S.banner]},3800);setInterval(()=>{const n=(parseFloat(bar.style.width||28)+3)%100;bar.style.width=Math.max(n,8)+'%'},1000);bannerText.textContent=banners[0]}init();
  </script>
</body>
